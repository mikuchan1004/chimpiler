{% extends 'templates/layout.html' %}

{% block title %}
<title>1:1 문의 | CHIMPILER</title>
{% endblock %}

{% block script %}
{% endblock %}

{% block main %}
<main class="community-shell">
    <div class="container community-layout" style="max-width:900px">
        <div class="community-head">
            <header class="page-heading">
                <span class="eyebrow">1:1 INQUIRY</span>
                <h1 class="page-title">1:1 문의하기</h1>
                <p class="page-description">답변은 마이페이지의 문의 내역에서 확인할 수 있습니다.</p>
            </header>
        </div>
        <nav class="tabs">
            <a class="tab" href="/notice">공지사항</a>
            <a class="tab" href="/faq">자주 묻는 질문</a>
            <a class="tab active" href="/inquiry-write">1:1 문의</a>
        </nav>
        <form class="form-grid" id="inquiryForm">
            <label class="form-field">
                <span class="form-label">문의 유형</span>
                <select class="form-control" id="inquiryType" name="inquiry_type">
                    <option>상품문의</option>
                    <option>배송문의</option>
                    <option>예약문의</option>
                    <option>기타문의</option>
                </select>
            </label>
            <label class="form-field">
                <span class="form-label">제목</span>
                <input class="form-control" id="inquiryTitle" name="inquiry_title">
            </label>
            <label class="form-field full">
                <span class="form-label">문의 내용</span>
                <textarea class="form-control" id="inquiryDetail" name="inquiry_detail">
</textarea>
            </label>
            <label class="form-field full">
                <span class="form-label">첨부파일</span>
                <input class="form-control" id="inquiryAttachment" name="inquiry_attachment" type="file">
            </label>
            <div class="form-field full" style="display:flex;justify-content:flex-end;gap:10px">
                <a class="button secondary" href="/notice">취소</a>
                <button class="button" id="inquirySubmitButton">문의 등록</button>
            </div>
        </form>
    </div>
</main>
{% endblock %}
