{% extends 'templates/layout.html' %}

{% block title %}
    <title>장바구니 | CHIMPILER</title>
{% endblock %}

{% block script %}
{% endblock %}

{% block main %}
<main class="page-section">
    <div class="container">
        <header class="page-heading">
            <span class="eyebrow">SHOPPING CART</span>
            <h1 class="page-title">장바구니</h1>
        </header>
        <div class="cart-select-toolbar"><label class="check-field"><input id="cartSelectAll" type="checkbox"
                    checked><span>전체 선택</span></label><button class="button secondary small"
                id="cartSelectedDeleteButton" type="button">선택 삭제</button></div>
        <div class="cart-layout">
            <section class="card" id="cartItemList">
                <article class="cart-item">
                    <input class="cart-checkbox" type="checkbox" checked aria-label="상품 선택">
                    <img class="cart-thumb" src="static/images/supplement-01-vita-core.png" alt="">
                    <div>
                        <strong>데일리 비타 코어 멀티비타민</strong>
                        <p class="muted">29,800원</p>
                        <span class="quantity">
                            <button>−</button>
                            <input value="1">
                            <button>＋</button>
                        </span>
                    </div>
                    <div class="cart-item-actions">
                        <strong>29,800원</strong>
                        <br>
                        <button class="button secondary small">삭제</button>
                    </div>
                </article>
                <article class="cart-item">
                    <input class="cart-checkbox" type="checkbox" checked aria-label="상품 선택">
                    <img class="cart-thumb" src="static/images/fitness-02-power-band.png" alt="">
                    <div>
                        <strong>파워 루프 운동 밴드 세트</strong>
                        <p class="muted">19,900원</p>
                        <span class="quantity">
                            <button>−</button>
                            <input value="1">
                            <button>＋</button>
                        </span>
                    </div>
                    <div class="cart-item-actions">
                        <strong>19,900원</strong>
                        <br>
                        <button class="button secondary small">삭제</button>
                    </div>
                </article>
            </section>
            <aside class="panel sticky-summary">
                <h2>결제 예정 금액</h2>
                <div class="summary-list">
                    <div class="summary-row">
                        <span>상품 금액</span>
                        <strong>49,700원</strong>
                    </div>
                    <div class="summary-row">
                        <span>배송비</span>
                        <strong>0원</strong>
                    </div>
                    <div class="summary-row total">
                        <span>총 결제금액</span>
                        <strong id="cartTotalPrice">49,700원</strong>
                    </div>
                </div>
                <a class="button full" id="cartCheckoutButton" href="/checkout">선택 상품 주문하기</a>
            </aside>
        </div>
    </div>
</main>
{% endblock %}
