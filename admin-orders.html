<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>주문/배송관리</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
    <header class="admin-header">
        <nav class="container admin-nav">
            <a class="brand-name" href="/dashboard">관리자 페이지</a>
            <a href="/dashboard">대시보드</a>
            <a href="/inquiries">문의관리</a>
            <a href="/users">회원관리</a>
            <a href="/products">상품/재고관리</a>
            <a class="active" href="/orders">주문/배송관리</a>
            <a href="/reservations">예약관리</a>
            <a href="/main">홈으로</a>
        </nav>
    </header>
    <main class="container admin-layout">
        <div class="admin-toolbar">
            <h1 class="page-title">주문/배송관리</h1>
            <select class="form-control" id="orderStatusFilter" style="max-width:200px">
                <option>전체 상태</option>
                <option>주문접수</option>
                <option>상품준비중</option>
                <option>배송완료</option>
            </select>
        </div>
        <div class="table-wrap">
            <table class="data-table" id="adminOrderTable">
                <thead>
                    <tr>
                        <th>주문서</th>
                        <th>회원</th>
                        <th>수령인</th>
                        <th>금액</th>
                        <th>결제</th>
                        <th>배송</th>
                        <th>처리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1004</td>
                        <td>human</td>
                        <td>홍길동</td>
                        <td>49,000원</td>
                        <td>
                            <span class="badge success">결제완료</span>
                        </td>
                        <td>
                            <span class="badge warning">배송대기</span>
                        </td>
                        <td>
                            <button class="button success small" id="deliveryCompleteButton">배송완료 처리</button>
                            <button class="button secondary small" id="shippingNotificationButton" type="button">배송 알림
                                발송</button>
                            <button class="button secondary small" id="completionNotificationButton" type="button">완료 알림
                                발송</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
