<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% block title %}
        <title>관리자 페이지 | CHIMPILER</title>
    {% endblock %}

    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages.css">
    <link rel="stylesheet" href="/static/css/responsive.css">

    {% block style %}
    {% endblock %}
</head>

<body class="admin-body">
    <header class="admin-header">
        <nav class="container admin-nav" aria-label="관리자 메뉴">
            <a class="brand-name" href="/admin">관리자 페이지</a>

            <a class="{% if request.url.path == '/admin' or request.url.path == '/admin/' %}active{% endif %}"
               href="/admin">대시보드</a>

            <a class="{% if request.url.path.startswith('/admin/inquiries') %}active{% endif %}"
               href="/admin/inquiries">문의관리</a>

            <a class="{% if request.url.path.startswith('/admin/users') %}active{% endif %}"
               href="/admin/users">회원관리</a>

            <a class="{% if request.url.path.startswith('/admin/products') %}active{% endif %}"
               href="/admin/products">상품/재고관리</a>

            <a class="{% if request.url.path.startswith('/admin/orders') %}active{% endif %}"
               href="/admin/orders">주문/배송관리</a>

            <a class="{% if request.url.path.startswith('/admin/reservations') %}active{% endif %}"
               href="/admin/reservations">예약관리</a>

            <span class="admin-welcome" style="margin-left: auto;">관리자님</span>
            <a href="/">홈으로</a>
        </nav>
    </header>

    {% block main %}
    {% endblock %}

    {% block script %}
    {% endblock %}
</body>
