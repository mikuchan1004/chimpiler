<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>로그인 | CHIMPILER</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>

<body>
    <main class="auth-shell">
        <section class="card auth-card"><a href="main.html"><img class="auth-logo"
                    src="static/images/chimpiler-logo.png" alt="침파일러"></a>
            <h1 class="auth-title">로그인</h1>
            <div class="social-buttons"><button class="social-button naver" id="naverLoginButton">네이버 아이디로
                    로그인</button><button class="social-button kakao" id="kakaoLoginButton">카카오 아이디로 로그인</button></div>
            <div class="divider">또는</div>
            <form id="loginForm" class="summary-list"><label class="form-field"><span
                        class="form-label">아이디</span><input class="form-control" id="loginUserId" name="user_id"
                        autocomplete="username"></label><label class="form-field"><span
                        class="form-label">비밀번호</span><input class="form-control" id="loginPassword"
                        name="user_password" type="password" autocomplete="current-password"></label>
                <p class="danger-text hidden" id="loginErrorMessage">아이디 또는 비밀번호를 확인해 주세요.</p><button
                    class="button full" id="loginSubmitButton">로그인</button>
            </form>
            <nav class="auth-links"><a href="#">ID/PW 찾기</a><a href="/signup">회원가입</a></nav>
        </section>
    </main>
</body>

</html>
