<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>이용약관 | CHIMPILER</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/pages.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>

<script>
    window.onload = () => {
        const termsPageAgreement =
            document.querySelector('#termsPageAgreement')

        const termsAcceptButton =
            document.querySelector('#termsAcceptButton')

        // 이전에 동의한 상태가 있다면 복원
        if (
            sessionStorage.getItem('termsAgreed') === 'true'
        ) {
            termsPageAgreement.checked = true
        }

        // 체크 여부에 따라 확인 버튼 활성화
        termsAcceptButton.disabled =
            !termsPageAgreement.checked

        termsPageAgreement.addEventListener(
            'change',
            function () {
                termsAcceptButton.disabled =
                    !this.checked
            }
        )

        // 동의 상태를 저장하고 회원가입 페이지로 이동
        termsAcceptButton.addEventListener(
            'click',
            function () {
                if (!termsPageAgreement.checked) {
                    alert('이용약관에 동의해 주세요.')
                    return
                }

                sessionStorage.setItem(
                    'termsAgreed',
                    'true'
                )

                location.href = '/signup'
            }
        )
    }
</script>

<body>
    <main class="auth-shell">
        <section class="card auth-card">
            <span class="eyebrow">TERMS</span>
            <h1 class="auth-title">이용약관</h1>
            <div class="panel" style="max-height:430px;overflow:auto">
                <h2>제1조 목적</h2>
                <p>본 약관은 CHIMPILER HEALTHCARE가 제공하는 서비스 이용에 관한 기본 사항을 규정합니다.</p>
                <h2>제2조 건강정보 안내</h2>
                <p>AI 건강 체크 결과와 상품 추천은 참고 정보이며 의료인의 진단이나 처방을 대신하지 않습니다.</p>
                <h2>제3조 회원의 의무</h2>
                <p>회원은 정확한 정보를 입력하고 계정 정보를 안전하게 관리해야 합니다.</p>
                <h2>제4조 주문 및 예약</h2>
                <p>재고가 없는 상품은 예약할 수 있으며 입고 시 예약 순서에 따라 구매 기회가 제공됩니다.</p>
            </div>
            <label class="check-field" style="margin:20px 0"><input id="termsPageAgreement" type="checkbox">
                <span>약관을 확인하고 동의합니다.</span>
            </label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <a class="button secondary" href="/signup">
                    취소
                </a>

                <button class="button"
                        id="termsAcceptButton"
                        type="button"
                        disabled>
                    동의하고 돌아가기
                </button>
            </div>
        </section>
    </main>
</body>
</html>
