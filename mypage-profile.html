{% extends 'templates/layout.html' %}

{% block title %}
<title>회원정보 수정 | CHIMPILER</title>
{% endblock %}

{% block script %}
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>
    window.onload = () => {
        {% if request.query_params.get('password_result') == 'wrong' %}
        alert('현재 비밀번호가 일치하지 않습니다.')
        {% endif %}

        {% if request.query_params.get('password_result') == 'success' %}
        alert('비밀번호가 변경되었습니다.')
        {% endif %}

        const profileAddressButton =
            document.querySelector('#profileAddressButton')

        const profileAddress =
            document.querySelector('#profileAddress')

        const profileAddressDetail =
            document.querySelector('#profileAddressDetail')

        profileAddressButton.addEventListener(
            'click',
            function () {
                new kakao.Postcode({
                    oncomplete: function (data) {
                        profileAddress.value =
                            `${data.address} (${data.zonecode})`

                        profileAddressDetail.value = ''
                        profileAddressDetail.focus()
                    }
                }).open()
            }
        )

        const profileForm =
            document.querySelector('#profileForm')

        const profilePhone =
            document.querySelector('#profilePhone')

        profileForm.addEventListener(
            'submit',
            function (event) {
                const phone = profilePhone.value
                    .replaceAll('-', '')
                    .trim()

                if (
                    phone.length !== 11
                    || !phone.startsWith('010')
                    || isNaN(phone)
                ) {
                    event.preventDefault()
                    alert(
                        '휴대폰 번호를 01012345678 형식으로 입력해 주세요.'
                    )
                    profilePhone.focus()
                }
            }
        )

        const passwordChangeButton =
            document.querySelector('#passwordChangeButton')

        const passwordChangeModal =
            document.querySelector('#passwordChangeModal')

        const passwordModalClose =
            document.querySelector('#passwordModalClose')

        const passwordModalCancel =
            document.querySelector('#passwordModalCancel')

        passwordChangeButton.addEventListener(
            'click',
            function () {
                passwordChangeModal.classList.add('is-open')
            }
        )

        function closePasswordModal() {
            passwordChangeModal.classList.remove('is-open')
        }

        passwordModalClose.addEventListener(
            'click',
            closePasswordModal
        )

        passwordModalCancel.addEventListener(
            'click',
            closePasswordModal
        )

        const passwordChangeForm =
            document.querySelector('#passwordChangeForm')

        const newPassword =
            document.querySelector('#newPassword')

        const newPasswordConfirm =
            document.querySelector('#newPasswordConfirm')

        passwordChangeForm.addEventListener(
            'submit',
            function (event) {
                if (
                    newPassword.value !==
                    newPasswordConfirm.value
                ) {
                    event.preventDefault()
                    alert('새 비밀번호가 일치하지 않습니다.')
                    newPasswordConfirm.focus()
                }
            }
        )
    }
</script>
{% endblock %}

{% block main %}
<main class="page-section">
    <div class="container mypage-layout">
        <nav class="card side-nav">
            <h2>마이페이지</h2>

            <a href="/mypage">
                <span class="side-nav-icon">⌂</span>
                <span>대시보드</span>
            </a>

            <a href="/mypage/orders">
                <span class="side-nav-icon">▣</span>
                <span>주문·배송 조회</span>
            </a>

            <a href="/mypage/reservations">
                <span class="side-nav-icon">◷</span>
                <span>예약구매 내역</span>
            </a>

            <a href="/mypage/inquiries">
                <span class="side-nav-icon">○</span>
                <span>1:1 문의</span>
            </a>

            <a class="active" href="/mypage/profile">
                <span class="side-nav-icon">♙</span>
                <span>회원정보 수정</span>
            </a>
        </nav>
        <section>
            <header class="page-heading">
                <span class="eyebrow">MY PAGE</span>
                <h1 class="page-title">개인정보 수정</h1>
            </header>
            <form class="panel form-grid"
                id="profileForm"
                action="/mypage/profile"
                method="post">

                <label class="form-field">
                    <span class="form-label">이름</span>
                    <input class="form-control"
                        id="profileName"
                        name="user_name"
                        value="{{ user_profile['user_name'] }}"
                        required>
                </label>

                <label class="form-field">
                    <span class="form-label">아이디</span>
                    <input class="form-control"
                        id="profileUserId"
                        value="{{ user_profile['user_id'] }}"
                        readonly>
                </label>

                <label class="form-field full">
                    <span class="form-label">주소</span>

                    <span class="input-row">
                        <input class="form-control"
                            id="profileAddress"
                            name="user_addr"
                            value="{{ user_profile['user_addr'] or '' }}"
                            readonly
                            required>

                        <button class="button secondary"
                                id="profileAddressButton"
                                type="button">
                            주소 검색
                        </button>
                    </span>
                </label>

                <label class="form-field full">
                    <span class="form-label">상세 주소</span>
                    <input class="form-control"
                        id="profileAddressDetail"
                        name="user_addr_detail"
                        value="{{ user_profile['user_addr_detail'] or '' }}"
                        required>
                </label>

                <label class="form-field">
                    <span class="form-label">이메일</span>
                    <input class="form-control"
                        id="profileEmail"
                        name="user_email"
                        type="email"
                        value="{{ user_profile['user_email'] or '' }}"
                        required>
                </label>

                <label class="form-field">
                    <span class="form-label">휴대폰 번호</span>
                    <input class="form-control"
                        id="profilePhone"
                        name="user_phone"
                        type="tel"
                        maxlength="13"
                        value="{{ user_profile['user_phone'] or '' }}"
                        placeholder="010-1234-5678"
                        required>
                </label>

                <div class="form-field full">
                    <button class="button secondary"
                            id="passwordChangeButton"
                            type="button">
                        비밀번호 변경
                    </button>
                </div>

                <div class="form-field full input-row">
                    <button class="button"
                            id="profileSaveButton"
                            type="submit">
                        정보 수정
                    </button>

                    <a class="button secondary"
                    href="/mypage">
                        취소
                    </a>
                </div>
            </form>
        </section>
    </div>
</main>
<div class="modal" id="passwordChangeModal">
    <form class="modal-dialog"
          id="passwordChangeForm"
          action="/mypage/profile/password"
          method="post">

        <header class="modal-header">
            <h2 class="modal-title">비밀번호 변경</h2>

            <button class="modal-close"
                    id="passwordModalClose"
                    type="button">
                ×
            </button>
        </header>

        <div class="modal-body summary-list">
            <label class="form-field">
                <span class="form-label">현재 비밀번호</span>
                <input class="form-control"
                       name="current_password"
                       type="password"
                       required>
            </label>

            <label class="form-field">
                <span class="form-label">새 비밀번호</span>
                <input class="form-control"
                       id="newPassword"
                       name="new_password"
                       type="password"
                       required>
            </label>

            <label class="form-field">
                <span class="form-label">새 비밀번호 확인</span>
                <input class="form-control"
                       id="newPasswordConfirm"
                       name="new_password_confirm"
                       type="password"
                       required>
            </label>
        </div>

        <footer class="modal-footer">
            <button class="button secondary"
                    id="passwordModalCancel"
                    type="button">
                취소
            </button>

            <button class="button" type="submit">
                변경
            </button>
        </footer>
    </form>
</div>
{% endblock %}
