{% extends 'templates/layout.html' %}

{% block title %}
<title>주문서 작성 | CHIMPILER</title>
{% endblock %}

{% block script %}
{% endblock %}

{% block main %}
<main class="page-section">
    <div class="container">
        <header class="page-heading">
            <span class="eyebrow">CHECKOUT</span>
            <h1 class="page-title">주문서 작성</h1>
            <a class="button secondary small" id="continueShoppingButton" href="/products">← 상품 더 둘러보기</a>
        </header>
        <form class="checkout-layout" id="checkoutForm">
            <div class="summary-list">
                <section class="panel">
                    <h2>주문 상품</h2>
                    <div class="order-card">
                        <img src="static/images/supplement-01-vita-core.png" alt="">
                        <div>
                            <strong>데일리 비타 코어 멀티비타민</strong>
                            <p>수량 1개 · 29,800원</p>
                        </div>
                    </div>
                </section>
                <section class="panel">
                    <h2>배송 정보</h2>
                    <div class="form-grid">
                        <label class="form-field">
                            <span class="form-label">받는 분</span>
                            <input class="form-control" id="receiverName" name="order_name">
                        </label>
                        <label class="form-field">
                            <span class="form-label">연락처</span>
                            <input class="form-control" id="receiverPhone" name="order_phone">
                        </label>
                        <label class="form-field full">
                            <span class="form-label">주소</span>
                            <span class="input-row">
                                <input class="form-control" id="receiverAddress" name="order_addr">
                                <button class="button secondary" type="button" id="addressSearchButton">주소
                                    검색</button>
                            </span>
                        </label>
                        <label class="form-field full">
                            <span class="form-label">상세 주소</span>
                            <input class="form-control" id="receiverAddressDetail">
                        </label>
                    </div>
                </section>
                <section class="panel">
                    <h2>결제 방법</h2>
                    <label>
                        <input type="radio" name="payment_method" value="card" checked> 카드결제</label> &nbsp; <label>
                        <input type="radio" name="payment_method" value="account"> 계좌 간편결제</label>
                    <div class="form-grid" id="cardPaymentFields">
                        <label class="form-field full">
                            <span class="form-label">카드번호</span>
                            <input class="form-control" id="cardNumber" inputmode="numeric" maxlength="19"
                                placeholder="숫자 16자리">
                        </label>
                        <label class="form-field">
                            <span class="form-label">유효기간</span>
                            <input class="form-control" id="cardExpiry" placeholder="MM/YY">
                        </label>
                        <label class="form-field">
                            <span class="form-label">CVC</span>
                            <input class="form-control" id="cardCvc" inputmode="numeric" maxlength="3">
                        </label>
                    </div>
                </section>
            </div>
            <aside class="panel sticky-summary">
                <h2>최종 결제 금액</h2>
                <div class="summary-list">
                    <div class="summary-row">
                        <span>상품 금액</span>
                        <strong>29,800원</strong>
                    </div>
                    <div class="summary-row">
                        <span>배송비</span>
                        <strong>0원</strong>
                    </div>
                    <div class="summary-row total">
                        <span>총 결제금액</span>
                        <strong id="checkoutTotalPrice">29,800원</strong>
                    </div>
                </div>
                <label>
                    <input id="orderAgreement" type="checkbox"> 주문 내용을 확인했으며 결제에 동의합니다.</label>
                <button class="button full" id="paymentSubmitButton" type="submit">29,800원 결제하기</button>
            </aside>
        </form>
    </div>
</main>
{% endblock %}
